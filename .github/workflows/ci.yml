name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting and dependencies
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/printkit
      - name: Check data races
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Render with installed Chrome
        if: runner.os == 'macOS'
        env:
          PRINTKIT_CHROME_TEST: "1"
          PRINTKIT_CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: go test -count=1 ./...
